[project]
site_name = {{ cookiecutter.project_name | tojson }}
site_url = "https://{{ cookiecutter.github_owner }}.github.io/{{ cookiecutter.project_slug }}/"
repo_url = "https://github.com/{{ cookiecutter.github_owner }}/{{ cookiecutter.project_slug }}"
repo_name = "{{ cookiecutter.github_owner }}/{{ cookiecutter.project_slug }}"
copyright = {{ ("Copyright &copy; 2026 " + cookiecutter.author_name) | tojson }}

nav = [
  { "Home" = "index.md" },
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"
