name: Template

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions: {}

jobs:
  render:
    name: Render template
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Install Cookiecutter
        run: uv tool install cookiecutter

      - name: Render project
        run: |
          render_dir="$RUNNER_TEMP/cookiecutter-output"
          mkdir "$render_dir"
          cookiecutter . --no-input --output-dir "$render_dir"

      - name: Check generated project
        run: |
          generated_dir="$(find "$RUNNER_TEMP/cookiecutter-output" -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -n "$generated_dir"
          cd "$generated_dir"
          uv sync
          uv run ruff format --check .
          uv run ruff check .
          uv run ty check .
          uv run pytest
